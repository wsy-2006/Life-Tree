<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>支点森林 · 养树日记</title>
    <style>
        /* 所有样式保持不变，和之前一样 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: linear-gradient(145deg, #f0f7e8 0%, #e1eec0 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            width: 100%;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(8px);
            border-radius: 48px;
            padding: 32px;
            box-shadow: 0 20px 40px rgba(0, 40, 0, 0.2);
            border: 1px solid rgba(160, 200, 120, 0.5);
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 600;
            color: #2d5a2d;
            text-align: center;
            letter-spacing: 2px;
            margin-bottom: 4px;
        }

        .subtitle {
            text-align: center;
            color: #4a704a;
            margin-bottom: 16px;
            font-style: italic;
        }

        .day-counter {
            text-align: center;
            font-size: 1.3rem;
            color: #2d5a2d;
            background: rgba(220, 240, 200, 0.8);
            padding: 8px 25px;
            border-radius: 40px;
            display: inline-block;
            margin: 0 auto 25px;
            border: 2px solid #8bb56a;
            box-shadow: 0 4px 0 #5d8c4d;
        }

        .day-counter span {
            font-weight: bold;
            font-size: 1.8rem;
            margin: 0 5px;
        }

        .main-panel {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .entries-panel {
            flex: 1.2;
            min-width: 350px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 32px;
            padding: 25px;
            box-shadow: inset 0 1px 4px rgba(255,255,255,0.8), 0 8px 12px rgba(0,20,0,0.1);
            max-height: 650px;
            overflow-y: auto;
        }

        .section-header {
            margin-bottom: 12px;
            position: relative;
        }

        .section-header h2 {
            font-size: 1.3rem;
            color: #1e3a1e;
            display: inline-block;
            border-bottom: 3px solid #8bb56a;
            padding-bottom: 4px;
        }

        .section-desc {
            font-size: 0.8rem;
            color: #5b7a5b;
            margin-top: 4px;
        }

        .view-detail-btn {
            background: none;
            border: 1px solid #8bb56a;
            color: #2d5a2d;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 0.8rem;
            cursor: pointer;
            margin-top: 5px;
            transition: 0.1s;
        }

        .view-detail-btn:hover {
            background: #8bb56a;
            color: white;
        }

        .entry-list {
            min-height: 60px;
            margin-bottom: 10px;
        }

        .entry-item {
            background: rgba(240, 250, 230, 0.8);
            border-radius: 40px;
            padding: 8px 16px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid #bcd0a0;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .entry-text {
            font-size: 0.95rem;
            color: #2a4a2a;
            word-break: break-word;
            max-width: 180px;
        }

        .entry-energy {
            font-weight: bold;
            padding: 2px 10px;
            border-radius: 30px;
            background: white;
            margin: 0 8px;
        }

        .entry-delete {
            background: none;
            border: none;
            color: #b15555;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 0 5px;
            transition: 0.1s;
        }

        .entry-delete:hover {
            color: #d33;
            transform: scale(1.2);
        }

        .add-entry {
            display: flex;
            gap: 6px;
            margin-top: 8px;
        }

        .add-entry input {
            flex: 2;
            padding: 10px 15px;
            border: 2px solid #b8d4a0;
            border-radius: 40px;
            font-size: 0.9rem;
            outline: none;
            background: white;
        }

        .add-entry input:focus {
            border-color: #5d9e5d;
        }

        .add-entry select {
            padding: 8px;
            border-radius: 30px;
            border: 2px solid #b8d4a0;
            background: white;
            font-weight: bold;
            color: #1e421e;
        }

        .add-btn {
            background: #3c763c;
            color: white;
            border: none;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: 0 4px 0 #1e421e;
            transition: 0.1s;
        }

        .add-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #1e421e;
        }

        .save-btn, .reset-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 60px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 20px;
            border: 1px solid rgba(100,130,70,0.5);
        }

        .save-btn {
            background: #3c763c;
            color: white;
            box-shadow: 0 6px 0 #1e421e;
        }

        .save-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #1e421e;
        }

        .reset-btn {
            background: #e0ecc0;
            color: #2a4a2a;
            box-shadow: 0 5px 0 #a0b87a;
        }

        .reset-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #a0b87a;
        }

        .canvas-container {
            flex: 1;
            min-width: 300px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        canvas {
            background: #d9e6c3;
            border-radius: 60px 60px 30px 30px;
            box-shadow: 0 20px 30px rgba(30, 50, 0, 0.3), inset 0 -2px 5px #aacf9e;
            border: 4px solid #658c46;
            width: 100%;
            height: auto;
            aspect-ratio: 4/5;
            display: block;
            cursor: pointer;
            transition: 0.2s;
        }

        canvas:hover {
            transform: scale(1.01);
            box-shadow: 0 25px 35px rgba(30, 50, 0, 0.4);
        }

        .energy-total {
            margin-top: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #2d5a2d;
            background: rgba(220, 240, 200, 0.7);
            padding: 8px 25px;
            border-radius: 40px;
            border: 1px solid #8bb56a;
        }

        .today-preview {
            margin-top: 20px;
            width: 100%;
            background: rgba(255, 255, 240, 0.9);
            border-radius: 24px;
            padding: 16px;
            border: 2px solid #b8d4a0;
            cursor: pointer;
            transition: 0.2s;
        }

        .today-preview:hover {
            background: rgba(255, 255, 230, 1);
            border-color: #8bb56a;
        }

        .preview-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            color: #2d5a2d;
            margin-bottom: 8px;
        }

        .preview-arrow {
            font-size: 0.8rem;
            color: #5d8c4d;
        }

        .preview-content {
            font-size: 0.9rem;
            color: #3a5a3a;
            line-height: 1.4;
            max-height: 60px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            color: #396039;
            font-size: 0.95rem;
            border-top: 1px dashed #a0c090;
            padding-top: 18px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: #f5fae8;
            border-radius: 40px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            max-height: 70vh;
            overflow-y: auto;
            box-shadow: 0 30px 40px rgba(0, 30, 0, 0.3);
            border: 3px solid #8bb56a;
        }

        .diary-modal {
            max-width: 600px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #b8d4a0;
            padding-bottom: 15px;
        }

        .modal-header h2 {
            color: #1e3a1e;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #5b7a5b;
            padding: 5px 10px;
        }

        .close-btn:hover {
            color: #d33;
        }

        .detail-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .detail-item {
            background: rgba(220, 240, 200, 0.5);
            border-radius: 20px;
            padding: 15px;
            border-left: 5px solid #8bb56a;
        }

        .detail-date {
            font-size: 0.8rem;
            color: #5d8c4d;
            margin-bottom: 5px;
        }

        .detail-text {
            font-size: 1rem;
            color: #1e3a1e;
            margin-bottom: 5px;
        }

        .detail-energy {
            font-size: 0.9rem;
            color: #4a704a;
        }

        .diary-entry {
            background: rgba(255, 255, 240, 0.7);
            border-radius: 20px;
            padding: 18px;
            margin-bottom: 15px;
            border: 1px solid #b8d4a0;
        }

        .diary-date {
            font-size: 1rem;
            font-weight: bold;
            color: #2d5a2d;
            margin-bottom: 10px;
            border-bottom: 1px dashed #b8d4a0;
            padding-bottom: 5px;
        }

        .diary-day {
            font-size: 0.8rem;
            color: #5d8c4d;
            margin-left: 10px;
        }

        .diary-content {
            color: #2a4a2a;
            line-height: 1.5;
        }

        .diary-stats {
            margin-top: 10px;
            font-size: 0.9rem;
            color: #4a704a;
            background: rgba(200, 220, 180, 0.5);
            padding: 8px;
            border-radius: 12px;
        }

        /* 调试面板 */
        .debug-panel {
            position: fixed;
            bottom: 10px;
            right: 10px;
            background: rgba(0,0,0,0.8);
            color: #0f0;
            padding: 15px;
            border-radius: 10px;
            font-family: monospace;
            font-size: 12px;
            z-index: 2000;
            max-width: 300px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌳 支点森林</h1>
        <p class="subtitle">记录日常滋养，培育你的反脆弱之树</p>
        
        <div class="day-counter" id="dayCounter">
            🌱 养树第 <span id="dayNumber">1</span> 天
        </div>
        
        <div class="main-panel">
            <div class="entries-panel">
                <!-- 根系 -->
                <div class="section-header">
                    <h2>🌱 根系 · 安全支点</h2>
                    <p class="section-desc">规律生活、情绪角落、社区连接</p>
                    <button class="view-detail-btn" onclick="showDetail('root')">查看详情 →</button>
                </div>
                <div class="entry-list" id="rootEntries"></div>
                <div class="add-entry">
                    <input type="text" id="rootInput" placeholder="例如：和父母散步、冥想10分钟...">
                    <select id="rootEnergy">
                        <option value="1">1💧</option>
                        <option value="2">2💧</option>
                        <option value="3" selected>3💧</option>
                        <option value="4">4💧</option>
                        <option value="5">5💧</option>
                    </select>
                    <button class="add-btn" onclick="addEntry('root')">+</button>
                </div>

                <!-- 主干 -->
                <div class="section-header" style="margin-top: 25px;">
                    <h2>🌲 主干 · 生存支点</h2>
                    <p class="section-desc">职业韧性、财富配置</p>
                    <button class="view-detail-btn" onclick="showDetail('trunk')">查看详情 →</button>
                </div>
                <div class="entry-list" id="trunkEntries"></div>
                <div class="add-entry">
                    <input type="text" id="trunkInput" placeholder="例如：学新技能、梳理资产...">
                    <select id="trunkEnergy">
                        <option value="1">1☀️</option>
                        <option value="2">2☀️</option>
                        <option value="3" selected>3☀️</option>
                        <option value="4">4☀️</option>
                        <option value="5">5☀️</option>
                    </select>
                    <button class="add-btn" onclick="addEntry('trunk')">+</button>
                </div>

                <!-- 枝叶 -->
                <div class="section-header" style="margin-top: 25px;">
                    <h2>🍃 枝叶 · 扩展支点</h2>
                    <p class="section-desc">关系网络、兴趣探索</p>
                    <button class="view-detail-btn" onclick="showDetail('branch')">查看详情 →</button>
                </div>
                <div class="entry-list" id="branchEntries"></div>
                <div class="add-entry">
                    <input type="text" id="branchInput" placeholder="例如：约朋友吃饭、开始攀岩...">
                    <select id="branchEnergy">
                        <option value="1">1🍂</option>
                        <option value="2">2🍂</option>
                        <option value="3" selected>3🍂</option>
                        <option value="4">4🍂</option>
                        <option value="5">5🍂</option>
                    </select>
                    <button class="add-btn" onclick="addEntry('branch')">+</button>
                </div>

                <button id="saveBtn" class="save-btn">💾 完成今日培育</button>
                <button id="resetBtn" class="reset-btn">🔄 重置今天</button>
            </div>
            
            <div class="canvas-container">
                <canvas id="treeCanvas" width="400" height="500"></canvas>
                <div class="energy-total" id="energyTotal">
                    根:0 | 干:0 | 叶:0
                </div>
                
                <div class="today-preview" id="todayPreview" onclick="showDiary()">
                    <div class="preview-header">
                        <span>📖 今日养树日记</span>
                        <span class="preview-arrow">→ 查看完整日记</span>
                    </div>
                    <div class="preview-content" id="previewContent">
                        还没有记录今天的培育...
                    </div>
                </div>
            </div>
        </div>
        
        <div class="footer">
            <p>每一次微小行动，都在滋养你的人生之树</p>
        </div>
    </div>

    <!-- 详情弹窗 -->
    <div id="detailModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">🌱 根系详情</h2>
                <button class="close-btn" onclick="closeModal()">✕</button>
            </div>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <!-- 日记弹窗 -->
    <div id="diaryModal" class="modal">
        <div class="modal-content diary-modal">
            <div class="modal-header">
                <h2>📖 养树日记</h2>
                <button class="close-btn" onclick="closeDiary()">✕</button>
            </div>
            <div class="modal-body" id="diaryBody"></div>
        </div>
    </div>

       <!-- 调试面板 -->
    <div class="debug-panel" id="debugPanel">
        <div style="font-weight:bold; margin-bottom:5px;">🔧 调试信息</div>
        <div id="debugContent"></div>
        <div style="margin-top:8px; display:flex; gap:5px;">
            <button onclick="debugClear()" style="padding:2px 5px;">🧹 清除所有数据</button>
            <button onclick="debugShow()" style="padding:2px 5px;">📋 显示数据</button>
        </div>
    </div>


    <script src="script.js"></script>
</body>
</html>
